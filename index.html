<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Salesforce Campaign Name Generator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f0f8ff;
            color: #333;
        }
        h1 {
            color: #00BBDD;
        }
        label {
            display: block;
            margin-top: 10px;
            color: #00BBDD;
        }
        select, input {
            width: 220px;
            padding: 5px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            background-color: #00BBDD;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0099bb;
        }
        .container {
            margin-bottom: 20px;
        }
        #naming_convention {
            font-weight: bold;
            color: #00BBDD;
        }
        img {
            width: 200px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <img src="https://www6.thalesgroup.com/l/51442/2024-05-29/dz5b62/51442/1716987489jWe1Yl8A/thales_logo_170x38.png" alt="Thales Logo">
    <h1>Salesforce Campaign Name Generator</h1>
    <div class="container">
        <label for="year">Year:</label>
        <select id="year"></select>
    </div>
    <div class="container">
        <label for="qtr">Quarter/Half:</label>
        <select id="qtr">
            <option value="">None</option>
            <option value="Q1">Q1</option>
            <option value="Q2">Q2</option>
            <option value="Q3">Q3</option>
            <option value="Q4">Q4</option>
            <option value="H1">H1</option>
            <option value="H2">H2</option>
        </select>
    </div>
    <div class="container">
        <label for="bu">Business Unit:</label>
        <select id="bu">
            <option value="DS">DS</option>
            <option value="IAM">IAM</option>
            <option value="DP">DP</option>
        </select>
    </div>
    <div class="container">
        <label for="region">Region:</label>
        <select id="region" onchange="updateSubregions()">
            <option value="AMER">AMER</option>
            <option value="APAC">APAC</option>
            <option value="EMEA">EMEA</option>
            <option value="GLOB">GLOB</option>
        </select>
    </div>
    <div class="container">
        <label for="subregion">Sub-region:</label>
        <select id="subregion" onchange="updateCountries()">
            <option value="">None</option>
        </select>
    </div>
    <div class="container">
        <label for="country">Country:</label>
        <select id="country">
            <option value="">None</option>
        </select>
    </div>
    <div class="container">
        <label for="abm">ABM (optional):</label>
        <input type="checkbox" id="abm" value="ABM">
    </div>
    <div class="container">
        <label for="type">Type:</label>
        <select id="type" onchange="updateDetails()">
            <option value="DM">Direct Mail</option>
            <option value="CJM">Channel Joint Marketing</option>
            <option value="Email">Email</option>
            <option value="Event">Event</option>
            <option value="MR">Marketing Research</option>
            <option value="OFAD">Offline Advertising</option>
            <option value="OSM">Organic Social Media</option>
            <option value="PDA">Paid Display Ads</option>
            <option value="PDM">Paid Media</option>
            <option value="PDS">Paid Search</option>
            <option value="PSM">Paid Social Media</option>
            <option value="TM">Telemarketing</option>
            <option value="WBN">Webinar</option>
            <option value="WEB">Website</option>
        </select>
    </div>
    <div class="container">
        <label for="details">Details (optional) dependent on type:</label>
        <select id="details"></select>
    </div>
    <div class="container">
        <label for="pathfactory">Pathfactory (optional):</label>
        <input type="checkbox" id="pathfactory" value="PF">
    </div>
    <div class="container">
        <label for="reachdesk">Reachdesk (optional):</label>
        <input type="checkbox" id="reachdesk" value="RDK">
    </div>
    <div class="container">
        <label for="activity_name">Activity Name:</label>
        <input type="text" id="activity_name">
    </div>
    <div class="container">
        <label for="month">Month:</label>
        <select id="month">
            <option value="Jan">Jan</option>
            <option value="Feb">Feb</option>
            <option value="Mar">Mar</option>
            <option value="Apr">Apr</option>
            <option value="May">May</option>
            <option value="Jun">Jun</option>
            <option value="Jul">Jul</option>
            <option value="Aug">Aug</option>
            <option value="Sep">Sep</option>
            <option value="Oct">Oct</option>
            <option value="Nov">Nov</option>
            <option value="Dec">Dec</option>
        </select>
    </div>
    <div class="container">
        <label for="day">Day:</label>
        <select id="day">
            <!-- Add days 1 to 31 -->
            <script>
                for (let i = 1; i <= 31; i++) {
                    document.write('<option value="' + (i < 10 ? '0' + i : i) + '">' + i + '</option>');
                }
            </script>
        </select>
    </div>
    <button onclick="generateNamingConvention()">Generate Salesforce Campaign Name</button>
    <h2>SFDC Campaign name:</h2>
    <p id="naming_convention"></p>

    <script>
    const subregionOptions = {
        "AMER": ["None", "LATAM", "NORAM", "NORAM-CA", "NORAM-Central", "NORAM-East", "NORAM-West"],
    "APAC": ["None", "ANZ", "ASEAN", "GCK", "IN", "JP"],
    "EMEA": ["None", "BeNeLux", "CEE", "CIS", "DACH", "ES", "FR", "I", "IL", "IT", "META", "NORDICS", "PT", "SEMEA", "UK", "UKI"],
    "GLOB": ["None"]
    };

    const countryOptions = {
        "LATAM": ["None", "AR", "BB", "BO", "BR", "BS", "BZ", "CL", "CO", "CR", "CU", "DM", "DO", "EC", "GD", "GT", "GY", "HN", "HT", "JM", "KN", "LC", "MX", "NI", "PA", "PE", "PY", "SR", "SV", "TT", "UY", "VE"],
    "ANZ": ["None", "AU", "NZ"],
    "ASEAN": ["None", "ID", "MY", "PH", "SG", "TH", "VN"],
    "GCK": ["None", "GC", "MN", "MO"],
    "IN": ["None", "BD", "NP"],
    "JP": ["None", "JP"],
    "BeNeLux": ["None", "BE", "LU", "NL"],
    "CEE": ["None", "AL", "BA", "BG", "CZ", "EE", "HR", "HU", "LV", "LT", "ME", "MK", "PL", "RO", "RS", "SI", "SK", "XK"],
    "CIS": ["None", "AM", "AZ", "BY", "GE", "KG", "KZ", "MD", "RU", "TJ", "TM", "UA", "UZ"],
    "DACH": ["None", "AT", "CH", "DE"],
    "META": ["None", "AO", "BH", "BF", "BI", "BJ", "BW", "CD", "CF", "CG", "CI", "CM", "DJ", "DZ", "EG", "ER", "ET", "GA", "GH", "GM", "GQ", "GW", "IL", "IQ", "IR", "JO", "KE", "KM", "KW", "LB", "LR", "LS", "LY", "MA", "MG", "ML", "MR", "MU", "MW", "MZ", "NA", "NE", "NG", "OM", "PS", "QA", "RW", "SA", "SC", "SD", "SL", "SN", "SO", "SS", "ST", "SZ", "SY", "TD", "TG", "TN", "TR", "TZ", "UAE", "UG", "YE", "ZA", "ZM", "ZW"],
    "NORDICS": ["None", "DK", "FI", "NO", "SE"],
    "SEMEA": ["None", "AO", "BF", "BI", "BJ", "BW", "CD", "CF", "CG", "CI", "CM", "CY", "DJ", "DZ", "EG", "ER", "ES", "ET", "FR", "GA", "GH", "GM", "GQ", "GR", "GW", "IL", "IQ", "IR", "IT", "JO", "KE", "KM", "KW", "LB", "LR", "LS", "LY", "MA", "MG", "ML", "MR", "MU", "MW", "MZ", "NA", "NE", "NG", "OM", "PT", "PS", "QA", "RW", "SA", "SC", "SD", "SL", "SN", "SO", "SS", "ST", "SZ", "SY", "TD", "TG", "TN", "TZ", "UG", "YE", "ZA", "ZM", "ZW"],
    "UKI": ["None", "IE", "UK"]
    };

    function updateSubregions() {
        const region = document.getElementById("region").value;
        const subregionSelect = document.getElementById("subregion");
        subregionSelect.innerHTML = ""; // Clear existing options

        const options = subregionOptions[region] || ["None"];
        options.forEach(option => {
            const opt = document.createElement("option");
            opt.value = option;
            opt.innerHTML = option;
            subregionSelect.appendChild(opt);
        });

        updateCountries(); // Update countries based on the default subregion
    }

    function updateCountries() {
        const region = document.getElementById("region").value;
        const subregion = document.getElementById("subregion").value;
        const countrySelect = document.getElementById("country");
        countrySelect.innerHTML = ""; // Clear existing options

        let options;
        if (region === "EMEA" && countryOptions[subregion]) {
            // If the region is EMEA, populate countries based on the selected subregion
            options = countryOptions[subregion];
        } else {
            // Default to no countries or the selected subregion's countries
            options = countryOptions[subregion] || ["None"];
        }

        options.forEach(option => {
            const opt = document.createElement("option");
            opt.value = option === "None" ? "" : option;
            opt.innerHTML = option;
            countrySelect.appendChild(opt);
        });
    }

    const detailsOptions = {
        "DM": [""],
        "CJM": [""],
        "Email": [""],
        "Event": ["", "Customer", "Executive", "Federal", "Federal Partner", "List", "Partner", "Trade Show"],
        "MR": [""],
        "OFAD": [""],
        "OSM": ["", "Facebook", "LinkedIn", "Twitter", "YouTube"],
        "PDA": ["", "Banner"],
        "PDM": ["", "Google Display Network"],
        "PDS": ["", "Bing", "Google", "Yahoo", "Quora"],
        "PSM": ["", "Facebook", "LinkedIn", "Twitter", "YouTube"],
        "TM": [""],
        "WBN": [""],
        "WEB": ["", "Blog", "Chat", "Direct", "Email", "Organic - SEO", "Phone", "Press Release", "Referral"]
    };

    const detailsValues = {
        "None": "",
        "Customer": "CUST",
        "Executive": "EXEC",
        "Federal": "FED",
        "Federal Partner": "FPTNR",
        "List": "LIST",
        "Partner": "PTNR",
        "Trade Show": "TS",
        "Facebook": "FB",
        "LinkedIn": "LI",
        "Twitter": "TWT",
        "YouTube": "YT",
        "Google Display Network": "Google",
        "Banner": "Banner",
        "Content Syndication": "Cont-Synd",
        "Virtual Conference": "VConf",
        "Webinar": "WBN",
        "Bing": "Bing",
        "Google Ads": "Google",
        "Yahoo": "Yahoo",
        "Quora": "QUR",
        "Blog": "Blog",
        "Chat": "Chat",
        "Direct": "DIR",
        "Organic - SEO": "OSEO",
        "Phone": "PH",
        "Press Release": "PR",
        "Referral": "REF"
    };

    function updateDetails() {
        const type = document.getElementById("type").value;
        const detailsSelect = document.getElementById("details");
        detailsSelect.innerHTML = ""; // Clear existing options

        const options = detailsOptions[type] || ["None"];
        options.forEach(option => {
            const opt = document.createElement("option");
            opt.value = detailsValues[option] || option;
            opt.innerHTML = option;
            detailsSelect.appendChild(opt);
        });
    }

    function generateNamingConvention() {
        const year = document.getElementById("year").value;
        const qtr = document.getElementById("qtr").value;
        const bu = document.getElementById("bu").value;
        const region = document.getElementById("region").value;
        const subregion = document.getElementById("subregion").value;
        const country = document.getElementById("country").value;
        const abm = document.getElementById("abm").checked ? document.getElementById("abm").value : "";
        const type = document.getElementById("type").value;
        const details = document.getElementById("details").value;
        const pathfactory = document.getElementById("pathfactory").checked ? document.getElementById("pathfactory").value : "";
        const reachdesk = document.getElementById("reachdesk").checked ? document.getElementById("reachdesk").value : "";
        const activityName = document.getElementById("activity_name").value;
        const month = document.getElementById("month").value;
        const day = document.getElementById("day").value;
        const date = month + day;

        const parts = [
            year + qtr, // Combine year and quarter without a hyphen
            bu,
            region,
            subregion !== "" && subregion !== "None" ? subregion : "",
            country !== "" && country !== "None" ? country : "",
            abm,
            type,
            details,
            pathfactory,
            reachdesk,
            activityName,
            date
        ];

        const namingConvention = parts.filter(Boolean).join("-");
        document.getElementById("naming_convention").innerText = namingConvention;
        
         document.getElementById("naming_convention").scrollIntoView({ behavior: 'smooth' });
    }

    document.getElementById("region").addEventListener("change", updateSubregions);
    document.getElementById("subregion").addEventListener("change", updateCountries);

    document.getElementById("activity_name").addEventListener("input", function() {
        this.value = this.value.replace(/\s+/g, '-');
    });

    // Initialize subregions and countries based on default values
    updateSubregions();
    updateCountries();

    const yearSelect = document.getElementById('year');
    const currentYear = new Date().getFullYear();
    const maxYear = currentYear + 6;  // Set the range up to 6 years in the future
    for (let year = currentYear; year <= maxYear; year++) {
        const option = document.createElement('option');
        option.value = year;
        option.textContent = year;
        yearSelect.appendChild(option);
    }

    updateDetails(); // Initialize details based on the default type
    </script>
</body>
</html>
